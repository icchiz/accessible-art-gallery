<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ảnh Chú Chó Tương Tác</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Thư Viện Ảnh Các Loài Chó</h1>
    </header>

    <main>
      
        <div id="image-display">
            Rê chuột hoặc dùng phím Tab để chọn một chú chó bên dưới.
        </div>

        <h2>Danh Sách Hình Ảnh</h2>
        <div class="gallery">
            <img class="preview" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" alt="Chú chó Beagle đáng yêu đang nhìn ra ngoài">
            <img class="preview" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=500" alt="Chú chó Corgi chân ngắn đang chạy trên cỏ">
            <img class="preview" src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=500" alt="Chú chó Golden Retriever mỉm cười thân thiện">
            <img class="preview" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=500" alt="Chú chó French Bulldog mặt nếp nhăn ngơ ngác">
            <img class="preview" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=500" alt="Chú chó Husky mắt xanh tuyết phủ cực ngầu">
            <img class="preview" src="https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=500" alt="Chú chó Poodle lông xù màu nâu cà phê">
        </div>
    </main>

</body>
</html>
